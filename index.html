<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Expense Tracker</title>
</head>

<body>
    <div class="page-shell">
        <header class="topbar">
            <div>
                <p class="eyebrow">Personal finance</p>
                <h1>Expense Tracker</h1>
            </div>
            <span class="status-pill">Updated live</span>
        </header>

        <main class="app-panel">
            <section class="form-card">
                <div class="form-group">
                    <input type="text" id="expense-name" placeholder="Expense Name">
                    <input type="number" id="expense-amount" min="0.01" step="0.01" placeholder="Amount">
                    <select id="expense-category">
                        <option value="" disabled selected>Select Category</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Other">Other</option>
                    </select>
                    <input type="date" id="expense-date">
                    <button id="add-expense" disabled>Add Expense</button>
                </div>
            </section>

            <section class="table-card">
                <div class="toolbar">
                    <div class="field-group">
                        <label for="category-filter">Filter by Category</label>
                        <select id="category-filter">
                            <option value="All">All</option>
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="total">
                        Total: <span id="total-expense">$0.00</span>
                    </div>
                </div>

                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Expense Name</th>
                                <th>Amount</th>
                                <th>Category</th>
                                <th>Date</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="expense-table"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <div id="edit-modal" class="modal" aria-hidden="true">
        <div class="modal-content">
            <h2>Edit Expense</h2>
            <input type="text" id="edit-expense-name" placeholder="Expense Name">
            <input type="number" id="edit-expense-amount" min="0.01" step="0.01" placeholder="Amount">
            <select id="edit-expense-category">
                <option value="" disabled selected>Select Category</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Shopping">Shopping</option>
                <option value="Other">Other</option>
            </select>
            <input type="date" id="edit-expense-date">
            <div class="modal-actions">
                <button class="confirm-btn" id="confirm-edit">Save Change</button>
                <button class="cancel-btn" type="button" onclick="closeModal('edit-modal')">Cancel</button>
            </div>
        </div>
    </div>

    <div id="delete-modal" class="modal" aria-hidden="true">
        <div class="modal-content delete-modal-content">
            <h2>Confirm Delete</h2>
            <p>Are you sure you want to delete this expense?</p>
            <div class="modal-actions">
                <button class="confirm-btn" id="confirm-delete">Yes, Delete</button>
                <button class="cancel-btn" type="button" onclick="closeModal('delete-modal')">Cancel</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
